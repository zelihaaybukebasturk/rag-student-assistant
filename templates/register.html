<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #FF9A8B, #FF6A88, #FF99AC);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #444;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 14px 0;
            border: 1px solid #bbb;
            border-radius: 8px;
        }
        button {
            width: 100%;
            background: #FF6A88;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #e85a76;
        }
        .error {
            color: red;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .login-link {
            margin-top: 12px;
            display: block;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Choose a username" required>

        <input type="password" name="password" placeholder="Choose a password" required>

        <button type="submit">Register</button>
    </form>

    <a href="/login" class="login-link">Already have an account? Login</a>
</div>

</body>
</html>
